spring.application.name=checkinobra

# Datasource de la API: usuario checkinobra_app, solo DML (ver db/roles.sql).
# Sin usuario ni contraseña por defecto: si faltan, la API no arranca. Vienen del
# .env (docker-compose) o del entorno (IDE, CI); ver .env.example.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkinobra}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# El esquema lo maneja Flyway (db/migration). Hibernate no valida al arrancar: no hay una
# base por defecto a la cual conectarse (MT2), así que tampoco abre una conexión para
# detectar el dialecto, que se fija a mano. La suite de pruebas sí valida el mapeo.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Desactivado: con true la conexión queda tomada hasta terminar de serializar la
# respuesta, y un acceso perezoso fuera de la transacción pasaba sin avisar.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway lo corre el propio sistema, una vez por cada base del catálogo (MigradorDeBases, MT3),
# y no el autoconfigurado de Spring Boot, que migra una sola. Las migraciones de cada empresa
# son las mismas (db/migration) y las aplica el usuario migrador, dueño del esquema; la API en
# ejecución no tiene permisos de DDL. Si no se define FLYWAY_USER usa el de la API, que solo
# sirve contra una base de un único usuario.
spring.flyway.enabled=false
spring.flyway.user=${FLYWAY_USER:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}

# JWT — sin valor por defecto: JwtService se niega a arrancar si JWT_SECRET falta,
# tiene menos de 32 bytes o es el valor de ejemplo. Generar uno: openssl rand -base64 48
checkinobra.jwt.secret=${JWT_SECRET:}
# El token de acceso dura poco (antes, 8 horas): si se roba o el usuario deja de existir, el daño
# dura minutos. La sesión se mantiene con el refresh token (SEG10).
checkinobra.jwt.expiracion-minutos=30
# El refresh token rota en cada uso; este es lo que dura sin usarse.
checkinobra.jwt.refresh-dias=7

# Login — bloqueo creciente por cuenta y por IP tras fallos seguidos (S-02).
# La cuenta tolera 5 fallos y se bloquea 1 min; luego cada fallo la bloquea de
# nuevo con el doble, hasta 1 h. La IP tolera 30 y se bloquea 5 min.
checkinobra.login.cuenta.max-fallos=5
checkinobra.login.cuenta.bloqueo-base-segundos=60
checkinobra.login.cuenta.bloqueo-maximo-segundos=3600
checkinobra.login.ip.max-fallos=30
checkinobra.login.ip.bloqueo-base-segundos=300
checkinobra.login.ip.bloqueo-maximo-segundos=3600
checkinobra.login.olvido-segundos=86400

# Base de catálogo (MT1): qué empresas existen y cómo conectarse a cada una. La API
# conecta como checkinobra_plataforma (solo DML); sus migraciones las aplica el
# migrador (FLYWAY_USER). Sin usuario ni contraseña por defecto: si faltan, no arranca.
checkinobra.catalogo.url=${CATALOGO_URL:jdbc:postgresql://localhost:5432/checkinobra_catalogo}
checkinobra.catalogo.username=${CATALOGO_USER}
checkinobra.catalogo.password=${CATALOGO_PASSWORD}

# Primera empresa (MT1): en una base vacía, al arrancar, nace esta empresa con su
# administrador (la V2 que la sembraba salió de db/migration). El RUT también es el de
# la empresa que se registra en el catálogo como dueña de la base actual.
checkinobra.primera-empresa.rut=${PRIMERA_EMPRESA_RUT:76.412.330-9}
checkinobra.primera-empresa.nombre=${PRIMERA_EMPRESA_NOMBRE:Constructora Arauco Ltda.}

# Primer administrador (SEG3). La migración V11 anuló el PIN 0000 que sembraba V2;
# la clave inicial viene de PRIMER_ADMIN_CLAVE (8 o más caracteres), y la cuenta
# queda obligada a cambiarla en su primer ingreso. Solo se aplica a un ADMIN sin
# credencial: reiniciar la API con la variable puesta no pisa la clave elegida.
checkinobra.primer-admin.email=${PRIMER_ADMIN_EMAIL:admin@arauco-ltda.cl}
checkinobra.primer-admin.clave=${PRIMER_ADMIN_CLAVE:}

# Importación masiva — las planillas de catálogo son de kilobytes, no de megas.
# El tope está para que un archivo equivocado falle rápido y con un mensaje
# claro, en vez de ocupar memoria del servidor mientras se sube entero.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Salud para el HEALTHCHECK del contenedor y los orquestadores (SEG11). Es lo único del actuator
# que se expone, sin detalles. No incluye la base de datos: el DataSource es el enrutador por
# empresa y no hay una conexión que probar sin una empresa en el contexto.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=false

# Primer operador de plataforma (MT6): se crea al arrancar solo si el catálogo no tiene ninguno.
checkinobra.plataforma.operador.email=${PLATAFORMA_OPERADOR_EMAIL:}
checkinobra.plataforma.operador.clave=${PLATAFORMA_OPERADOR_CLAVE:}

# Alta de empresas por API (MT7). Sin la contraseña del aprovisionador el alta no está disponible.
checkinobra.plataforma.aprovisionador.username=${DB_APROVISIONADOR_USER:checkinobra_aprovisionador}
checkinobra.plataforma.aprovisionador.password=${DB_APROVISIONADOR_PASSWORD:}
# Directorio de las contraseñas de las bases creadas por la API (referencia file: del catálogo).
checkinobra.secretos.directorio=${SECRETOS_DIR:./secretos}
