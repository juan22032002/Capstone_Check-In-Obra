name: CI

# develop es la rama de integración: los PR llegan ahí antes que a main, así
# que si la CI no corre sobre ella, valida siempre después de haber mezclado.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos validando un commit que ya quedó atrás.
# Permisos mínimos para el GITHUB_TOKEN de todos los jobs (SEG11): ninguno escribe en el repositorio.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot + Maven)
    runs-on: ubuntu-latest

    # contextLoads es un @SpringBootTest: levanta el contexto completo, así que
    # necesita una base real. Flyway corre las migraciones sobre esta instancia
    # vacía y Hibernate (ddl-auto=validate) comprueba que el mapeo calce.
    services:
      db:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_DB: checkinobra
          # Superusuario de un contenedor efimero del runner: no es alcanzable desde
          # fuera de el. La API y Flyway no lo usan; ver el paso de roles.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d checkinobra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # La API conecta como checkinobra_app (solo DML) y Flyway como
      # checkinobra_migrador, igual que en docker-compose. Las contraseñas se
      # generan en cada corrida y se enmascaran en el log.
      - name: Crear los roles de base de datos
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: checkinobra
        run: |
          app_pw="$(openssl rand -hex 24)"
          migrador_pw="$(openssl rand -hex 24)"
          plataforma_pw="$(openssl rand -hex 24)"
          aprovisionador_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$app_pw"
          echo "::add-mask::$migrador_pw"
          echo "::add-mask::$plataforma_pw"
          echo "::add-mask::$aprovisionador_pw"
          echo "DB_APP_PASSWORD=$app_pw" >> "$GITHUB_ENV"
          echo "DB_MIGRADOR_PASSWORD=$migrador_pw" >> "$GITHUB_ENV"
          echo "DB_PLATAFORMA_PASSWORD=$plataforma_pw" >> "$GITHUB_ENV"
          echo "DB_APROVISIONADOR_PASSWORD=$aprovisionador_pw" >> "$GITHUB_ENV"
          CHECKINOBRA_APP_PASSWORD="$app_pw" \
          CHECKINOBRA_MIGRADOR_PASSWORD="$migrador_pw" \
          CHECKINOBRA_PLATAFORMA_PASSWORD="$plataforma_pw" \
          CHECKINOBRA_APROVISIONADOR_PASSWORD="$aprovisionador_pw" \
          CHECKINOBRA_BASES_EXTRA="checkinobra_b" \
            ./db/crear-roles.sh

      # El respaldo por base (MT8) se prueba con los scripts de verdad. pg_dump debe ser de la misma
      # versión mayor que el servidor: el del runner es más nuevo (17+) y su volcado trae parámetros
      # que PostgreSQL 16 no conoce (transaction_timeout). Por eso las herramientas se corren DENTRO
      # del contenedor del servicio, que trae las del propio servidor.
      - name: Elegir las herramientas de PostgreSQL del respaldo
        run: |
          contenedor="$(docker ps --filter 'publish=5432' --format '{{.ID}}' | head -n1)"
          test -n "$contenedor" || { echo "No encuentro el contenedor del servicio db" >&2; exit 1; }
          docker exec -i "$contenedor" sh -c 'pg_dump --version && psql --version && pg_restore --version'
          echo "CHECKINOBRA_PG_PREFIX=docker exec -i $contenedor" >> "$GITHUB_ENV"

      - name: Compilar y testear
        working-directory: backend
        env:
          # El servicio queda expuesto en localhost:5432 del runner, no en 5433
          # como en docker-compose (ahí ese puerto evita choques con otro
          # Postgres local; en CI no hay nada más escuchando).
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/checkinobra
          SPRING_DATASOURCE_USERNAME: checkinobra_app
          SPRING_DATASOURCE_PASSWORD: ${{ env.DB_APP_PASSWORD }}
          FLYWAY_USER: checkinobra_migrador
          FLYWAY_PASSWORD: ${{ env.DB_MIGRADOR_PASSWORD }}
          CATALOGO_URL: jdbc:postgresql://localhost:5432/checkinobra_catalogo
          CATALOGO_USER: checkinobra_plataforma
          CATALOGO_PASSWORD: ${{ env.DB_PLATAFORMA_PASSWORD }}
          DB_APROVISIONADOR_PASSWORD: ${{ env.DB_APROVISIONADOR_PASSWORD }}
          SECRETOS_DIR: ${{ runner.temp }}/secretos
          # En la CI la prueba del respaldo falla (no se omite) si faltan las herramientas.
          CHECKINOBRA_EXIGIR_RESPALDO: "true"
        run: ./mvnw -B verify

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Fijada a la misma versión que se usa en desarrollo. Al subirla,
          # actualizar también el environment.sdk de mobile/pubspec.yaml.
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Preparar .env
        working-directory: mobile
        # pubspec.yaml declara .env como asset y el archivo real no se versiona,
        # así que sin esta copia el bundle de assets no se arma y falla el build.
        run: cp .env.example .env

      - name: Descargar dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Verificar formato
        working-directory: mobile
        # dart format cambio de estilo por defecto en Dart 3.7; el codigo se
        # normalizo a ese estilo, asi que este paso lo mantiene estable.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar
        working-directory: mobile
        run: flutter analyze

      - name: Testear
        working-directory: mobile
        run: flutter test

      - name: Compilar APK de debug
        working-directory: mobile
        # Debug y no release: el release necesita keystore de firma, que no
        # está en el repo. Igual valida que Gradle y el lado Android compilen.
        run: flutter build apk --debug
