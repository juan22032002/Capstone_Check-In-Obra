# Dependabot (SEG11, S-14): propone actualizaciones de cada ecosistema que usa el proyecto, una vez
# por semana y agrupadas para no abrir un PR por dependencia.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      spring: {patterns: ["org.springframework*"]}
  - package-ecosystem: pub
    directory: /mobile
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /
    schedule: {interval: weekly}
