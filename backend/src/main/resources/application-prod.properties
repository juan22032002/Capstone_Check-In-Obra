# Perfil de producción (SEG11, S-12): se activa con SPRING_PROFILES_ACTIVE=prod.
#
# Swagger y la descripción de la API (/v3/api-docs) son públicos en desarrollo porque ayudan a
# probar; en producción le entregan a cualquiera el mapa completo de endpoints y de cuerpos.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
